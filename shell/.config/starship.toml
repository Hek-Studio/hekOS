# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = '#414868'

# Replace the "❯" symbol in the prompt with "➜"
[character]
success_symbol = "[ ](bold #7aa2f7)"
error_symbol = "[ ](bold #f7768e)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:#bb9af7"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:#bb9af7)[$symbol $branch(:$remote_branch)](fg:#15161e bg:#bb9af7)[ ](bold fg:#bb9af7)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold #f7768e)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](#9ece6a)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:#bb9af7 bold fg:#15161e)[](bold fg:#bb9af7)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed #9ece6a"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:#bb9af7 fg:#15161e"
style_root = "#f7768e bold"
format = "[](bold fg:#bb9af7)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:#7dcfff fg:#15161e"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:#7dcfff)[󰉋 → $path]($style)[](bold fg:#7dcfff)'

[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:#e0af68)[󰪢 $duration](bold bg:#e0af68 fg:#15161e)[](bold fg:#e0af68)'